<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="识字星球：3500常用汉字、拼音打字、间隔复习、硬笔书写、笔顺演示、记忆方法和开放许可图片搜索。">
  <title>识字星球 · 和芽芽老师一起探索汉字</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="design-v32.css">
  <script defer src="data.js"></script>
  <script defer src="notes.js"></script>
  <script defer src="app.js"></script>
  <script defer src="strokes.js"></script>
  <script defer src="advanced.js"></script>
  <script defer src="teacher-engine.js"></script>
  <script defer src="teacher.js"></script>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">🌱</div>
      <div><h1>识字星球</h1><p>看图 · 识字 · 拼音 · 五笔 · 打字闯关</p></div>
    </div>
    <span class="offline-tag">离线优先 · 无需登录</span>
  </header>
  <section class="intro">
    <div>
      <span class="eyebrow">给儿童的互动识字小课堂</span>
      <h2>每天认识几个字，<br><em>一点一点积累。</em></h2>
      <p>从常见汉字开始，看字形、读拼音，再到键盘上把它打出来。</p>
      <div class="intro-badges"><span>📚 <b id="letterCount">3500 字</b>可查</span><span>🎨 看图联想</span><span>⌨️ 即时闯关</span></div>
    </div>
    <div class="intro-art"><span>山</span><span>☀️</span><span>水</span><span>🌿</span></div>
  </section>
  <section class="stats" aria-label="学习成绩">
    <div class="stat"><small>已经认识</small><strong id="learnedStat">0 / 3500</strong></div>
    <div class="stat"><small>累计答对</small><strong id="correctStat">0</strong></div>
    <div class="stat"><small>待复习错字</small><strong id="wrongStat">0</strong></div>
  </section>
  <div class="searchbar">
    <span aria-hidden="true">⌕</span>
    <input id="topSearch" aria-label="搜索汉字拼音和词语" placeholder="搜索汉字、拼音或词语，例如：山、shui、月亮">
    <button id="topSearchBtn">搜索字库</button>
  </div>
  <nav class="tabs" aria-label="功能导航">
    <button class="tab active" data-view="learn">📖 认字卡</button>
    <button class="tab" data-view="bank">🗂️ 汉字字库</button>
    <button class="tab" data-view="game">⌨️ 拼音闯关</button>
    <button class="tab" data-view="wubi">🔤 五笔入门</button>
    <button class="tab" data-view="review">📝 错字本</button>
  </nav>
  <main id="content" aria-label="识字学习内容">
    <section class="panel">正在加载本地汉字库……</section>
  </main>
  <footer>3500字字形与拼音数据依据 mapull/chinese-dictionary（MIT）整理。多音字、释义与配图仍需分级校对。<br>全部资源可本地运行；朗读依赖浏览器和设备已安装的中文语音。</footer>
</div>
</body>
</html>
