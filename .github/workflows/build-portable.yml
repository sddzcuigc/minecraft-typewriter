name: Build portable offline packages

on:
  push:
    branches: [main]
    paths:
      - "shizixingqiu/**"
      - ".github/workflows/build-portable.yml"
  pull_request:
    paths:
      - "shizixingqiu/**"
      - ".github/workflows/build-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-engine:
    name: Test offline teacher engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free teacher tests
        run: node shizixingqiu/teacher-engine.test.js

  browser-regression:
    needs: test-engine
    name: Chromium mobile and tablet journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tooling (CI only, not app runtime)
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve offline-first static site locally
        run: |
          python3 -m http.server 4173 --directory shizixingqiu > /tmp/szx-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Run real Chromium 320/375/768px regression
        run: npx playwright test shizixingqiu/mobile-regression.spec.mjs --reporter=line
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizixingqiu-mobile-browser-evidence
          path: |
            artifacts/mobile/**
            test-results/**
          if-no-files-found: warn
          retention-days: 30

  build:
    needs: [test-engine, browser-regression]
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            goos: windows
            goarch: amd64
            output: shizixingqiu-windows-amd64.exe
          - label: Linux x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            output: shizixingqiu-linux-amd64
          - label: macOS Apple Silicon
            runner: ubuntu-latest
            goos: darwin
            goarch: arm64
            output: shizixingqiu-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: shizixingqiu/go.mod
      - name: Build self-contained launcher
        shell: bash
        working-directory: shizixingqiu
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o "../dist/${{ matrix.output }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  source-package:
    needs: [test-engine, browser-regression]
    name: Package source and offline web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source package
        run: |
          mkdir -p dist
          cd shizixingqiu
          zip -r ../dist/shizixingqiu-source.zip . -x "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: shizixingqiu-source
          path: dist/shizixingqiu-source.zip
          if-no-files-found: error
          retention-days: 30
